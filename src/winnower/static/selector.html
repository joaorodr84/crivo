<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Winnower</title>
  <link rel="stylesheet" href="/static/selector.css">
</head>
<body>
  <header class="bar">
    <div class="bar-top">
      <h1>Winnower</h1>
      <p id="progress-text" class="progress-text">Loading…</p>
      <button id="finish" class="primary" type="button" disabled>Finish</button>
    </div>
    <div class="progress" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>
  <main id="list"></main>
  <div id="done" class="finished" hidden>
    <h2>Finished</h2>
    <p>You can close this tab. Winnower is downloading, resizing and zipping your picks; the
    result is written where the terminal says.</p>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="attribution">
    Images are shown from <a href="https://pixabay.com" target="_blank" rel="noopener noreferrer">Pixabay</a>
    for you to choose from. Each one names its contributor and links to its Pixabay page.
  </footer>
  <script src="/static/selector.js"></script>
</body>
</html>
