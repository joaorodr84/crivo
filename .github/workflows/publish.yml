# Publishes to PyPI when a release tag is pushed.
#
# `python -m scripts.release --write` (CONTRIBUTING.md -> Releases) creates the tag locally
# and deliberately never pushes it, so the tag push remains the one manual, on-purpose step
# that ships a release. This workflow is what that push now triggers: build the sdist and
# wheel setuptools-scm versions from the tag, and hand them to PyPI.
#
# Uses PyPI's trusted publishing (OIDC), not a token: nothing to rotate or leak in a repo
# secret. Set it up once at https://pypi.org/manage/account/publishing/ with this repo,
# workflow filename (publish.yml) and the `pypi` environment below.
name: Publish

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools-scm needs the tag history, not just this commit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: python -m pip install build
      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi # matches the trusted publisher config on PyPI; add required
    # reviewers here (Settings -> Environments -> pypi) for a manual approval gate.
    permissions:
      id-token: write # required for trusted publishing; no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
